<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TickiKaki – Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <main class="container">
    <section id="login" class="card">
      <h1>TickiKaki</h1>
      <p class="muted">Gib dein Passwort ein, um zu spielen.</p>
      <form id="loginForm">
        <label for="password">Passwort</label>
        <input id="password" type="password" required autocomplete="current-password" placeholder="Passwort">
        <button type="submit">Einloggen</button>
      </form>
      <p id="loginError" class="error"></p>
    </section>

    <section id="gameApp" class="hidden">
      <header class="topbar">
        <div>
          <h1>TickiKaki</h1>
          <p id="welcome" class="muted"></p>
        </div>
        <button id="logoutBtn" class="secondary">Ausloggen</button>
      </header>

      <section class="card controls">
        <h2>Spielmodus</h2>
        <div class="mode-row">
          <button id="aiModeBtn">🤖 Gegen KI</button>
          <button id="friendModeBtn" class="secondary">👥 Mit Freund</button>
        </div>

        <div id="aiSettings" class="settings">
          <label for="difficulty">KI-Schwierigkeit</label>
          <select id="difficulty">
            <option value="easy">Leicht</option>
            <option value="medium" selected>Mittel</option>
            <option value="hard">Schwer – nahezu unschlagbar</option>
          </select>
        </div>

        <div id="friendSettings" class="friend-settings hidden">
          <div>
            <strong>Online mit einem Freund</strong>
            <p id="connectionStatus" class="muted">Erstelle ein Spiel oder tritt einem Spiel bei.</p>
          </div>

          <div class="room-actions">
            <button id="createRoomBtn">Spiel erstellen</button>
            <div class="join-row">
              <input id="roomCodeInput" maxlength="32" placeholder="Raum-Code">
              <button id="joinRoomBtn" class="secondary">Beitreten</button>
            </div>
          </div>

          <div id="roomCodeBox" class="room-code hidden">
            <span>Dein Raum-Code:</span>
            <strong id="roomCode"></strong>
            <button id="copyRoomBtn" class="secondary">Code kopieren</button>
          </div>
        </div>
      </section>

      <div class="grid">
        <section class="card game-card">
          <div class="game-head">
            <div>
              <h2>Tic-Tac-Toe</h2>
              <p id="status" class="status">Du bist X.</p>
            </div>
            <button id="restartBtn" class="secondary">Neues Spiel</button>
          </div>

          <div id="board" class="board" aria-label="Tic-Tac-Toe Spielfeld"></div>
          <p id="result" class="result"></p>
        </section>

        <aside id="adminPanel" class="card admin hidden">
          <h2>Admin Panel</h2>
          <p>Admin-Modus ist aktiv.</p>

          <div class="admin-box">
            <strong>Admin gewinnt immer</strong>
            <span>Im KI-Modus wird dein Sieg automatisch erzwungen.</span>
          </div>

          <button id="adminWinBtn">Sieg erzwingen</button>
          <button id="clearBoardBtn" class="secondary">Spielfeld leeren</button>
        </aside>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
